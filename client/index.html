<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TradingChart — Powered by LuxAlgo Open Ecosystem</title>
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300F2B0' stroke-width='2.2'><path d='M3 3v18h18'/><path d='m19 9-5 5-4-4-3 3'/></svg>" />
</head>
<body>
  <div id="app-container">
    <!-- Top Application Bar (LuxAlgo Quant Architecture) -->
    <header id="top-app-header">
      <div class="top-nav-left">
        <!-- Sidebar / Panels Dock Toggle Button -->
        <button id="btn-toggle-panels-dock" class="nav-icon-btn" title="Toggle Side Dock / Panels" aria-label="Toggle Side Dock">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
          </svg>
        </button>

        <!-- Mode Switcher Navigation Pills (Quant / Journal / + Panels) -->
        <nav class="nav-module-pills" aria-label="Workspaces">
          <button id="nav-btn-quant" class="nav-pill active" data-view="quant">
            <span id="nav-label-quant">Quant</span>
          </button>
          <button id="nav-btn-journal" class="nav-pill" data-view="journal">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
            </svg>
            <span id="nav-label-journal">Journal</span>
          </button>
          <button id="nav-btn-panels" class="nav-pill" data-view="panels">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14"/>
              <path d="M12 5v14"/>
            </svg>
            <span id="nav-label-panels">Panels</span>
          </button>
        </nav>

        <!-- TradingView Multi-Chart Layout Suite & Replay -->
        <div class="top-nav-layout-suite">
          <button id="btn-topbar-chart-style" class="nav-style-btn" title="Chart Style (Candles, Bars, Line, Area, Heikin Ashi)">
            <span id="topbar-chart-style-icon" style="display: flex; align-items: center;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="9" y1="2" x2="9" y2="6"/><rect x="6" y="6" width="6" height="12" rx="1" fill="currentColor" fill-opacity="0.3"/><line x1="9" y1="18" x2="9" y2="22"/></svg>
            </span>
            <span id="topbar-chart-style-label">Candles</span>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <button id="btn-topbar-compare" class="nav-compare-btn" title="Compare or Add Symbol (+ / Alt+C)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span id="topbar-compare-label">Compare</span>
          </button>
          <button id="btn-layout-manager" class="nav-layout-btn" title="TradingView Multi-Chart Layout Manager">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
            <span id="active-layout-name">1x1 Single</span>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <button id="btn-layout-save" class="nav-save-btn" title="Save Layout (Ctrl+S)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <span id="layout-save-label">Save</span>
          </button>
          <button id="btn-topbar-replay" class="nav-replay-btn" title="Bar Replay Engine (Historical Rewind)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg>
            <span id="topbar-replay-label">Replay</span>
          </button>
          <button id="btn-topbar-export" class="nav-export-btn" title="Export Chart Data (Alt+E)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span id="topbar-export-label">Export</span>
          </button>
        </div>
      </div>

      <div class="top-nav-right">
        <!-- Live Market Feed Latency Telemetry -->
        <div class="latency-badge" title="Live Data Stream Latency">
          <span class="pulse-dot"></span>
          <span id="latency-val" class="num-ltr">12ms</span>
        </div>

        <!-- Sound Audio Feedback Toggle Button -->
        <button id="btn-toggle-sound" class="nav-icon-btn" title="Toggle Sound Feedback (Alerts & Orders)" aria-label="Toggle Sound">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>

        <!-- Mobile Fullscreen / Rotate Button -->
        <button id="btn-mobile-fullscreen" class="mobile-only-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>

        <!-- Keyboard Shortcuts Reference Trigger -->
        <button id="btn-shortcuts-help" class="nav-icon-btn" title="Keyboard Shortcuts (?)" aria-label="Keyboard Shortcuts">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </button>

        <!-- Language Switcher (FA / EN with Vazirmatn font) -->
        <button id="btn-toggle-lang" class="nav-text-btn" title="Toggle English / Persian">
          FA / EN
        </button>

        <!-- User Profile Avatar (Official LuxAlgo Aesthetic) -->
        <div class="user-avatar-badge" title="Institutional Desk: TC-8942-INST">
          <div class="avatar-circle">IP</div>
          <span class="user-status-dot"></span>
        </div>
      </div>
    </header>

    <!-- Main Viewport -->
    <main id="main-viewport">
      <!-- 1. Quant Chart Workspace View -->
      <section id="chart-area" class="active-workspace-view">
        <!-- Floating Bar Replay Controls -->
        <div id="replay-bar"></div>

        <!-- Floating Instant Order Entry Widget (Institutional TradingView signature) -->
        <div id="chart-quick-trade" class="quick-trade-widget" title="1-Click Instant Market Execution">
          <button id="qt-toggle-btn" class="qt-minimize-btn" title="Minimize Quick Trade" aria-label="Minimize Quick Trade">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <div class="qt-content">
            <button id="quick-trade-sell-btn" class="qt-btn qt-sell" title="Sell / Short at Market">
              <span class="qt-action" id="qt-sell-label">SELL</span>
              <span class="qt-price num-ltr" id="quick-sell-price">...</span>
            </button>
            <div class="qt-middle-wrap">
              <div class="qt-qty-wrap">
                <button id="qt-qty-dec" class="qt-step-btn" title="Decrease size">−</button>
                <input type="number" id="quick-trade-qty" value="0.1" step="0.05" min="0.01" class="num-ltr" title="Order Quantity (BTC)" />
                <button id="qt-qty-inc" class="qt-step-btn" title="Increase size">+</button>
                <span class="qt-unit">BTC</span>
              </div>
              <div class="qt-spread-wrap" title="Current Bid/Ask Spread">
                <span class="qt-spread-label" id="qt-spread-label">Spread</span>
                <span class="qt-spread-val num-ltr" id="quick-trade-spread">$5.00</span>
              </div>
            </div>
            <button id="quick-trade-buy-btn" class="qt-btn qt-buy" title="Buy / Long at Market">
              <span class="qt-action" id="qt-buy-label">BUY</span>
              <span class="qt-price num-ltr" id="quick-buy-price">...</span>
            </button>
          </div>
        </div>

        <!-- Floating Collapsed Quick-Trade Trigger Pill -->
        <button id="qt-collapsed-trigger" class="qt-pill-trigger" title="Open 1-Click Execution">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span id="qt-pill-label">Trade</span>
        </button>

        <!-- Mount point for Vela WebGL2 Workspace (Native topbar, left toolbar, canvas, dock, mobilebar) -->
        <div id="vela-workspace-mount"></div>
      </section>

      <!-- Desktop Right-Hand Vertical Tool Rail (TradingView Signature Feature) -->
      <aside id="desktop-side-rail" class="desktop-only-rail" aria-label="Tool Rail">
        <button class="rail-btn" data-panel="watchlist" title="Watchlist">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
        <button class="rail-btn" data-panel="alerts" title="Alerts">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
        <button class="rail-btn" data-panel="paper" title="Trade / Paper Execution">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        </button>
        <button class="rail-btn" data-panel="dataWindow" title="Data Window">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        </button>
        <button class="rail-btn" data-panel="objects" title="Object Tree">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </button>
        <button class="rail-btn" data-panel="pine" title="Pine Editor">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        </button>
        <button class="rail-btn" data-panel="journal" title="Trade Journal">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </button>
        <button class="rail-btn" data-panel="screener" title="Technical Screener">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h20l-8 9.5v6.5l-4-2v-4.5L2 3z"/><line x1="15" y1="16" x2="20" y2="16"/><line x1="15" y1="19" x2="18" y2="19"/></svg>
        </button>
        <button class="rail-btn" data-panel="dom" title="Depth of Market (DOM)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>
        <button class="rail-btn" data-panel="calendar" title="Economic Calendar">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="12" cy="14" r="2" fill="currentColor"/></svg>
        </button>
        <button class="rail-btn" data-panel="news" title="Market News & Catalysts">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
        </button>
      </aside>

      <!-- 2. Full-Page Trade Journal Workspace View -->
      <section id="journal-workspace-view" style="display: none;">
        <!-- Dynamically mounted -->
      </section>
    </main>

    <!-- Desktop Collapsible Bottom Suite (starts collapsed for maximum chart canvas) -->
    <footer id="bottom-panel" class="desktop-only-bottom collapsed">
      <div class="panel-header-strip">
        <div class="panel-tabs">
          <button class="panel-tab active" data-view="pine">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
            <span id="tab-label-pine">Pine Editor</span>
          </button>
          <button class="panel-tab" data-view="strategy">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span id="tab-label-strategy">Strategy Tester</span>
          </button>
          <button class="panel-tab" data-view="propsim">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.45 1-1 1H8c-.55 0-1 .45-1 1v1c0 .55.45 1 1 1h8c.55 0 1-.45 1-1v-1c0-.55-.45-1-1-1h-1c-.55 0-1-.45-1-1v-2.34"/><path d="M6 4h12a2 2 0 0 1 2 2v3a6 6 0 0 1-6 6h0a6 6 0 0 1-6-6V6a2 2 0 0 1 2-2Z"/></svg>
            <span id="tab-label-propsim">Prop-Firm Simulator</span>
          </button>
          <button class="panel-tab" data-view="journal">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span id="tab-label-journal">Trade Journal</span>
          </button>
          <button class="panel-tab" data-view="trackers">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span id="tab-label-trackers">Trackers</span>
          </button>
          <button class="panel-tab" data-view="calendar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="12" cy="14" r="2" fill="currentColor"/></svg>
            <span id="tab-label-calendar">Economic Calendar</span>
          </button>
          <button class="panel-tab" data-view="screener">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h20l-8 9.5v6.5l-4-2v-4.5L2 3z"/></svg>
            <span id="tab-label-screener">Technical Screener</span>
          </button>
          <button class="panel-tab" data-view="news">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg>
            <span id="tab-label-news">Market News</span>
          </button>
        </div>

        <div style="display: flex; align-items: center; gap: 4px;">
          <button id="btn-maximize-bottom-panel" class="btn-header btn-icon-only" title="Maximize / Restore Panel">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          </button>
          <button id="btn-toggle-bottom-panel" class="btn-header btn-icon-only" title="Collapse / Expand Panel">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
        </div>
      </div>

      <div class="panel-body-area">
        <div id="view-pine" class="panel-view active"></div>
        <div id="view-strategy" class="panel-view"></div>
        <div id="view-propsim" class="panel-view"></div>
        <div id="view-journal" class="panel-view"></div>
        <div id="view-trackers" class="panel-view"></div>
        <div id="view-calendar" class="panel-view"></div>
        <div id="view-screener" class="panel-view"></div>
        <div id="view-news" class="panel-view"></div>
      </div>
    </footer>
  </div>

  <!-- + Panels Quick Picker Drawer / Menu -->
  <div id="modal-panels-menu" class="modal-overlay">
    <div class="modal-box panels-menu-box">
      <div class="modal-header">
        <h3>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          <span id="panels-menu-title">Workspace Panels & Tools</span>
        </h3>
        <button class="modal-close-btn" id="modal-close-panels-menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="panels-grid-menu">
        <button class="panel-menu-item" data-panel="watchlist">
          <div class="panel-item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </div>
          <div class="panel-item-info">
            <div class="panel-item-title">Watchlist</div>
            <div class="panel-item-desc">Live quotes, multi-asset search, categories</div>
          </div>
        </button>

        <button class="panel-menu-item" data-panel="paper">
          <div class="panel-item-icon" style="color: var(--accent-green);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
          </div>
          <div class="panel-item-info">
            <div class="panel-item-title">Trade (Paper)</div>
            <div class="panel-item-desc">Virtual execution, market/limit orders, P&L</div>
          </div>
        </button>

        <button class="panel-menu-item" data-panel="alerts">
          <div class="panel-item-icon" style="color: var(--accent-gold);">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </div>
          <div class="panel-item-info">
            <div class="panel-item-title">Alerts</div>
            <div class="panel-item-desc">Price cross triggers & webhook relays</div>
          </div>
        </button>

        <button class="panel-menu-item" data-panel="pine">

      </div>

      </div>

        <button class="sym-cat-btn" data-cat="crypto">Crypto</button>
        <button class="sym-cat-btn" data-cat="metals">Metals</button>
        <button class="sym-cat-btn" data-cat="commodities">Commodities</button>
        <button class="sym-cat-btn" data-cat="forex">Forex</button>
        <button class="sym-cat-btn" data-cat="indices">Indices</button>
        <button class="sym-cat-btn" data-cat="stocks">Stocks</button>
      </div>

      </div>
